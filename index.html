<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <div>Канищев Илья</div>
        <div>P3208</div>
        <div>12631</div>
    </header>

    <main class="content-wrapper">
        <div class="graph-container">
            <canvas id="graph" width="500" height="500"></canvas>
        </div>

        <div class="form-container">
            <form id="point-form">
                <div class="input-group">
                    <label for="x-input">Координата X (-5 ... 5):</label>
                    <input type="text" id="x-input" name="x" autocomplete="off">
                    <div id="x-error" class="error-message"></div>
                </div>

                <div class="input-group">
                    <div>Координата Y:</div>
                    <div class="button-group" id="y-buttons">
                        <button type="button" class="y-btn" value="-4">-4</button>
                        <button type="button" class="y-btn" value="-3">-3</button>
                        <button type="button" class="y-btn" value="-2">-2</button>
                        <button type="button" class="y-btn" value="-1">-1</button>
                        <button type="button" class="y-btn" value="0">0</button>
                        <button type="button" class="y-btn" value="1">1</button>
                        <button type="button" class="y-btn" value="2">2</button>
                        <button type="button" class="y-btn" value="3">3</button>
                        <button type="button" class="y-btn" value="4">4</button>
                    </div>
                    <input type="hidden" id="y-input" name="y">
                    <div id="y-error" class="error-message"></div>
                </div>

                <div class="input-group">
                    <label for="r-input">Радиус R (2 ... 5):</label>
                    <input type="text" id="r-input" name="r" autocomplete="off">
                    <div id="r-error" class="error-message"></div>
                </div>

                <button type="submit" class="submit-btn">Проверить</button>
            </form>
        </div>
    </main>

    <div class="table-container">
        <table id="results-table">
            <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                    <th>Время проверки</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
